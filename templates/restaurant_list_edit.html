<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>お店編集 - MOGU</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #fff8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
        }

        h2 {
            text-align: center;
            color: #ff6600;
            margin-bottom: 30px;
        }

        .form-container {
            background-color: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.15);
            width: 100%;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #ff6600;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffe5d1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #ff6600;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-primary {
            background-color: #ff6600;
            color: white;
        }

        .btn-primary:hover {
            background-color: #ff4500;
        }

        .btn-secondary {
            background-color: #ffe5d1;
            color: #ff6600;
        }

        .btn-secondary:hover {
            background-color: #ffd9c0;
        }
    </style>
</head>

<body>

    <h2>お店情報編集</h2>

    <div class="form-container">
        <form method="POST" action="{{ url_for('restaurant_list.restaurant_list_edit', restaurant_id=restaurant.id) }}">
            <div class="form-group">
                <label for="name">店名</label>
                <input type="text" id="name" name="name" value="{{ restaurant.name }}" required>
            </div>

            <div class="form-group">
                <label for="address">住所</label>
                <input type="text" id="address" name="address" value="{{ restaurant.address }}" required>
            </div>

            <div class="form-group">
                <label for="genre">ジャンル</label>
                <input type="text" id="genre" name="genre" value="{{ restaurant.genre }}" required>
            </div>

            <div class="form-group">
                <label for="price_select">価格帯</label>
                <select id="price_select" name="price" required>
                    <option value="">選択してください</option>
                    <option value="0-1000" {% if restaurant.price == '0-1000' %}selected{% endif %}>〜1000円</option>
                    <option value="1000-2000" {% if restaurant.price == '1000-2000' %}selected{% endif %}>1000〜2000円</option>
                    <option value="2000-3000" {% if restaurant.price == '2000-3000' %}selected{% endif %}>2000〜3000円</option>
                    <option value="3000-5000" {% if restaurant.price == '3000-5000' %}selected{% endif %}>3000〜5000円</option>
                    <option value="5000-" {% if restaurant.price == '5000-' %}selected{% endif %}>5000円以上</option>
                </select>
            </div>

            <div class="form-group">
                <label for="time">営業時間</label>
                <input type="text" id="time" name="time" value="{{ restaurant.time }}"
                    placeholder="例: 11:00〜22:00" required>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="{{ url_for('restaurant_list.restaurant_list') }}" class="btn btn-secondary">一覧に戻る</a>
            </div>
        </form>
    </div>

</body>

</html>
