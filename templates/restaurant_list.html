<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>お店一覧 - MOGU</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #fff8f0;
        }

        h2 {
            text-align: center;
            color: #ff6600;
            margin-top: 30px;
        }

        table {
            border-collapse: collapse;
            width: 85%;
            margin: 30px auto;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #ff6600;
            color: white;
        }

        tr:hover {
            background-color: #ffe5d1;
        }

        a {
            color: #ff6600;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            padding: 6px 12px;
            background-color: #ff6600;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff4500;
        }

        .back {
            text-align: center;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>

    <h2>お店一覧</h2>

    <table>
        <thead>
            <tr>
                <th>店名</th>
                <th>住所</th>
                <th>価格帯</th>
                <th>評価</th>
                <th>編集</th>
            </tr>
        </thead>
        <tbody>
            {% for restaurant in items %}
            <tr>
                <td>
                    <a href="{{ url_for('res_details.detail', restaurant_id=restaurant.id) }}">
                        {{ restaurant.name }}
                    </a>
                </td>
                <td>{{ restaurant.address }}</td>
                <td>{{ restaurant.min_price }}円〜{{ restaurant.max_price }}円</td>
                <td>{{ restaurant.avg_rating }}</td>
                <td>
                    <a href="#">{# TODO: implement edit route #}
                        <button>編集</button>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="back">
        <a href="{{ url_for('index') }}">トップに戻る</a>
    </div>

</body>

</html>
