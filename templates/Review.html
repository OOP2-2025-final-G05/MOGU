<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レビュー投稿 - MOGUMOGU</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #fff8f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #ff6600;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select, textarea, input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
        }

        .star-rating {
            direction: rtl;
            display: flex;
            justify-content: center;
            font-size: 32px;
            margin: 10px 0;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            color: #ccc;
            cursor: pointer;
        }

        .star-rating input:checked ~ label {
            color: #ff9900;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #ff9900;
        }

        /* ボタンエリアの設定 */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1; /* ボタンを同じ幅にする */
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        .btn-submit {
            background-color: #ff6600;
            color: white;
        }

        .btn-submit:hover {
            background-color: #ff4500;
        }

        .btn-back {
            background-color: #ffe5d1;
            color: #ff6600;
        }

        .btn-back:hover {
            background-color: #ffd9c0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>レビュー投稿</h1>

    <form method="post">

        <label>お店</label>
        <select name="restaurant_id" required>
            {% for restaurant in restaurants %}
                <option value="{{ restaurant.id }}">
                    {{ restaurant.name }}
                </option>
            {% endfor %}
        </select>

        <label>評価</label>
        <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5" required>
            <label for="star5">★</label>

            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4">★</label>

            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3">★</label>

            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2">★</label>

            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1">★</label>
        </div>

        <label>コメント</label>
        <textarea name="comment" rows="4" required></textarea>

        <label>年齢</label>
        <input type="number" name="age" min="1" required>

        <label>性別</label>
        <select name="gender" required>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="その他">その他</option>
        </select>

        <div class="btn-group">
            <button type="submit" class="btn btn-submit">投稿する</button>
            <a href="{{ url_for('restaurant_list.restaurant_list') }}" class="btn btn-back">一覧に戻る</a>
        </div>
    </form>
</div>

</body>
</html>
